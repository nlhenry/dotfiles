##### Panes ##################################################################

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"

set -g display-panes-active-colour "#f38ba8"
set -g display-panes-colour "#89b4fa"

set -g window-style "fg=#cdd6f4,bg=#1e1e2e"
set -g window-active-style "fg=#cdd6f4,bg=#1e1e2e"


##### Status bar #############################################################

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5

set -g status-style "fg=#cdd6f4,bg=#181825"

set -g status-left-length 40
set -g status-left \
  "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#181825] "

set -g status-right-length 80
set -g status-right \
  "#[fg=#89b4fa] %Y-%m-%d #[fg=#45475a]│ #[fg=#a6e3a1] %H:%M "

# Inactive windows
setw -g window-status-style "fg=#a6adc8,bg=#181825"
setw -g window-status-format \
  " #[fg=#6c7086]#I #[fg=#a6adc8]#W#{?window_flags,#[fg=#f9e2af]#F,} "

# Active window
setw -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa,bold"
setw -g window-status-current-format \
  " #[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W#{?window_flags, #F,} "

setw -g window-status-separator ""

# Messages and command prompts
set -g message-style "fg=#1e1e2e,bg=#f9e2af,bold"
set -g message-command-style "fg=#1e1e2e,bg=#89b4fa,bold"

# Copy mode
setw -g mode-style "fg=#1e1e2e,bg=#a6e3a1"


##### Activity notifications #################################################

set -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none
